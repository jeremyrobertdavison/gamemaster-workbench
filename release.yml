name: Build Foundry Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Foundry module ZIP
        shell: bash
        run: |
          zip -r "gamemaster-workbench-v${{ steps.version.outputs.version }}.zip" \
            module.json scripts styles templates README.md CHANGELOG.md \
            -x "*.DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: gamemaster-workbench-v${{ steps.version.outputs.version }}.zip
